<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hymn Sing-Along</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Coptic&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ed;--panel:#fffdf9;--ink:#1f1c18;--muted:#6f685e;--line:#e4ddd0;--accent:#8a2d0c;--accent-soft:#f6e3d6;--word:#fde7c8;--word-ink:#5a1c05}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15130f;--panel:#1e1b17;--ink:#ede7dc;--muted:#a59d90;--line:#363029;--accent:#f0a46d;--accent-soft:#3a2617;--word:#5b3416;--word-ink:#ffe2c6}}
:root[data-theme=dark]{--bg:#15130f;--panel:#1e1b17;--ink:#ede7dc;--muted:#a59d90;--line:#363029;--accent:#f0a46d;--accent-soft:#3a2617;--word:#5b3416;--word-ink:#ffe2c6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif;padding-bottom:150px}
header{max-width:900px;margin:auto;padding:20px 16px 6px}
h1{margin:0 0 4px;font-size:22px}
.src{color:var(--muted);font-size:13px}.src a{color:inherit}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.cols label{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;user-select:none;background:var(--panel)}
.cols input{display:none}.cols label:has(input:checked){background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:900px;margin:auto;padding:4px 16px}
.ln{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.ln.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ln.loop{border-style:dashed}
.ln.label{background:none;border:none;padding:2px 12px;margin:14px 0 -4px;cursor:default;color:var(--accent);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ln.label .ws,.ln.label .ar{display:none}.ln.label .en{margin:0;font-size:13px}
.ln.unsung{opacity:.55}
.ws{display:flex;flex-wrap:wrap;gap:2px 4px}
.w{display:inline-flex;flex-direction:column;align-items:flex-start;padding:2px 5px;border-radius:7px;transition:background .1s}
.w.on{background:var(--word);color:var(--word-ink)}
.w.sel{outline:2px solid var(--accent)}
.w .t{font-size:14px;color:var(--muted)}.w.on .t{color:inherit}
.w .c{font-family:'Noto Sans Coptic',Antinoou,serif;font-size:22px;line-height:1.3}
.en{margin-top:4px;font-size:15px}
.ar{margin-top:2px;font:19px/1.6 'Noto Naskh Arabic',serif;direction:rtl;text-align:right}
.hide-c .w .c,.hide-t .w .t,.hide-e .en,.hide-a .ar{display:none}
.hide-c.hide-t .ws{display:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 16px 12px;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.bar .in{max-width:900px;margin:auto}
.tl{position:relative;height:22px;cursor:pointer}
.tl .track{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--line)}
.tl .fill{position:absolute;left:0;top:9px;height:4px;border-radius:2px;background:var(--accent)}
.tl .tick{position:absolute;top:5px;width:2px;height:12px;background:var(--muted);opacity:.45}
.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl button,.ctl select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:36px}
.ctl button.main{background:var(--accent);border-color:var(--accent);color:#fff;min-width:64px}
.ctl button.on{background:var(--accent-soft);border-color:var(--accent)}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;margin-left:auto}
.edit{display:none;margin-top:8px;font-size:13px;color:var(--muted);gap:8px;align-items:center;flex-wrap:wrap}
body.editing .edit{display:flex}
.kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
.cmp{margin-top:10px;font-size:13px;color:var(--muted);display:none}.has-cmp .cmp{display:block}
.cmp b{color:var(--ink)}.cmp .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:6px 0 2px}
.cmp .seg button{font:inherit;font-size:13px;border:0;background:var(--panel);color:var(--ink);padding:5px 10px;cursor:pointer}
.cmp .seg button.on{background:var(--accent);color:#fff}
.lg{display:inline-flex;align-items:center;gap:4px;margin-right:10px}.lg i{width:14px;height:4px;border-radius:2px;display:inline-block}
.has-cmp .w{border-bottom:4px solid transparent}.w.ok{border-bottom-color:#3a9a5b}.w.warn{border-bottom-color:#d79a1e}.w.bad{border-bottom-color:#c8412b}.w.nog{border-bottom-color:var(--line)}
.w .d{display:none;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.has-cmp .w .d{display:block}
.yt{max-width:560px;margin:12px 0 0;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}.yt iframe,.yt>div{width:100%;height:100%;border:0;display:block}
.note{max-width:900px;margin:0 auto;padding:0 16px;color:var(--muted);font-size:12px}
</style></head><body>
<header>
 <h1 id="title"></h1>
 <div class="src" id="src"></div>
 <div class="cols" id="cols">
  <label><input type="checkbox" data-k="c" checked>Coptic</label>
  <label><input type="checkbox" data-k="t" checked>English letters</label>
  <label><input type="checkbox" data-k="e" checked>English</label>
  <label><input type="checkbox" data-k="a">Arabic</label>
 </div>
</header>
<div class="cmp" id="cmp" style="max-width:900px;margin:0 auto;padding:0 16px"></div>
<main id="text"></main>
<p class="note">Timings were made automatically and may be off in places. Teachers can fix them: press <b>Fix timings</b>.</p>
<div class="bar"><div class="in">
 <div class="tl" id="tl"><div class="track"></div><div class="fill" id="fill"></div></div>
 <div class="ctl">
  <button id="prev" title="Previous line">⏮</button>
  <button id="back" title="Back 5 seconds">−5s</button>
  <button id="play" class="main">Play</button>
  <button id="next" title="Next line">⏭</button>
  <button id="loop" title="Repeat the current line">Repeat line</button>
  <select id="rate" title="Speed"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option></select>
  <button id="editbtn" title="Correct word timings">Fix timings</button>
  <span class="time" id="time">0:00</span>
 </div>
 <div class="edit">Click a word to select it, then press <span class="kbd">T</span> as it starts to be sung: it takes the current time and moves to the next word.
  <button id="dl">Download corrected timings</button></div>
</div></div>
<audio id="au" src="AUDIO_SRC" preload="auto"></audio>
<script>
const L=/*LESSON*/null;
const $=s=>document.querySelector(s);
// media: an <audio> element, or (published site) the original YouTube video behind the same small interface
let au=$('#au');
if(L.youtube){au=ytMedia(L.youtube)}
function ytMedia(id){
 const box=document.createElement('div');box.className='yt';box.innerHTML='<div id="ytp"></div>';$('header').appendChild(box);
 const m={paused:true,duration:L.duration||0,playbackRate:1,_t:0,_at:0,_p:null,_rate:1,onplay:null,onpause:null,onseeked:null,_ready:[],
  addEventListener(ev,f){if(ev==='loadedmetadata')this._ready.push(f)},
  play(){this._p&&this._p.playVideo()},pause(){this._p&&this._p.pauseVideo()}};
 Object.defineProperty(m,'currentTime',{get(){if(!m._p||!m._p.getCurrentTime)return m._t;const t=m._p.getCurrentTime();
   if(t!==m._t){m._t=t;m._at=performance.now()}return m.paused?t:t+(performance.now()-m._at)/1000*m._rate},
  set(v){m._t=v;m._at=performance.now();m._p&&m._p.seekTo(v,true);setTimeout(()=>m.onseeked&&m.onseeked(),60)}});
 Object.defineProperty(m,'playbackRate',{get(){return m._rate},set(v){m._rate=v;m._p&&m._p.setPlaybackRate(v)}});
 const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
 window.onYouTubeIframeAPIReady=()=>{m._p=new YT.Player('ytp',{videoId:id,playerVars:{playsinline:1,rel:0,modestbranding:1},
  events:{onReady:()=>{m.duration=m._p.getDuration()||m.duration;m._ready.forEach(f=>f())},
   onStateChange:e=>{const was=m.paused;m.paused=e.data!==YT.PlayerState.PLAYING;m._t=m._p.getCurrentTime();m._at=performance.now();
    if(was&&!m.paused&&m.onplay)m.onplay();if(!was&&m.paused&&m.onpause)m.onpause()}}})};
 return m}
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=Math.max(0,t||0);return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
document.title=L.title+' · Sing-Along';
$('#title').textContent=L.title;
$('#src').innerHTML=`Recording: <a href="${esc(L.audio.source)}" target="_blank" rel="noopener">${esc(L.audio.title||L.audio.source)}</a>${L.audio.channel?' ('+esc(L.audio.channel)+')':''} · Text: <a href="${esc(L.text_source)}" target="_blank" rel="noopener">tasbeha.org</a>`;
const words=[];
$('#text').innerHTML=L.lines.map((ln,li)=>`<div class="ln${ln.label?' label':(ln.start==null?' unsung':'')}" data-l="${li}" ${ln.start==null&&!ln.label?'title="Not in this recording"':''}><div class="ws">${ln.words.map((w,wi)=>{words.push({li,wi,w});return `<span class="w" data-l="${li}" data-w="${wi}"><span class="t">${esc(w.translit)}</span><span class="c" lang="cop">${esc(w.coptic)}</span>${'gold' in w?`<span class="d">${w.start==null?'–':w.start.toFixed(1)} / ${w.gold==null?'–':w.gold.toFixed(1)}s</span>`:''}</span>`}).join('')}</div><div class="en">${esc(ln.english)}</div><div class="ar" lang="ar">${esc(ln.arabic)}</div></div>`).join('');
const lineEls=[...document.querySelectorAll('.ln')],wordEls=[...document.querySelectorAll('.w')];
if(L.compare)words.forEach((x,i)=>{const w=x.w;wordEls[i].classList.add(w.gold==null||w.start==null?'nog':(Math.abs(w.start-w.gold)<=0.5?'ok':Math.abs(w.start-w.gold)<=2?'warn':'bad'))});
// column toggles, remembered per browser
let prefs={};try{prefs=JSON.parse(localStorage.getItem('sa-cols'))||{}}catch(e){}
document.querySelectorAll('#cols input').forEach(i=>{if(i.dataset.k in prefs)i.checked=prefs[i.dataset.k];
 const ap=()=>document.body.classList.toggle('hide-'+i.dataset.k,!i.checked);ap();
 i.onchange=()=>{ap();prefs[i.dataset.k]=i.checked;try{localStorage.setItem('sa-cols',JSON.stringify(prefs))}catch(e){}}});
let K='start';  // which timings drive the highlighting: 'start' (automatic) or 'gold' (tasbeha, hand-checked)
const lstart=li=>{const ws=L.lines[li].words.filter(w=>w[K]!=null);return ws.length?ws[0][K]:null};
if(L.compare){document.body.classList.add('has-cmp');const c=L.compare;
 $('#cmp').innerHTML=`<div>Compared with tasbeha.org's hand-checked timings for this recording: <b>${c.within_0_5}%</b> of words start within 0.5 s, <b>${c.within_1}%</b> within 1 s, <b>${c.within_2}%</b> within 2 s (median gap ${c.median} s, ${c.n} words).</div>
 <div class="seg"><button data-k="start" class="on">Highlight with automatic timings</button><button data-k="gold">Highlight with tasbeha's timings</button></div>
 <div><span class="lg"><i style="background:#3a9a5b"></i>within 0.5 s</span><span class="lg"><i style="background:#d79a1e"></i>0.5–2 s off</span><span class="lg"><i style="background:#c8412b"></i>over 2 s off</span>Under each word: automatic / tasbeha start time.</div>`;
 document.querySelectorAll('#cmp .seg button').forEach(b=>b.onclick=()=>{K=b.dataset.k;document.querySelectorAll('#cmp .seg button').forEach(x=>x.classList.toggle('on',x===b));ticks();curW=-1;wordEls.forEach(e=>e.classList.remove('on'));tick()});}
const lend=li=>{for(let j=li+1;j<L.lines.length;j++){const s=lstart(j);if(s!=null)return s}return au.duration||1e9};
function ticks(){const d=au.duration;if(!d)return;$('#tl').querySelectorAll('.tick').forEach(t=>t.remove());
 L.lines.forEach((_,li)=>{const s=lstart(li);if(s==null)return;const t=document.createElement('div');t.className='tick';t.style.left=(100*s/d)+'%';$('#tl').appendChild(t)})}
au.addEventListener('loadedmetadata',ticks);
let curL=-1,curW=-1,loopL=-1,editing=false,sel=null;
function locate(t){let wIdx=-1;for(let i=0;i<words.length;i++){const s=words[i].w[K];if(s!=null&&s<=t+0.02)wIdx=i}return wIdx}
function tick(){const t=au.currentTime;
 if(loopL>=0&&t>=lend(loopL)-0.05){au.currentTime=lstart(loopL)}
 const wi=locate(t);
 if(wi!==curW){if(curW>=0)wordEls[curW].classList.remove('on');curW=wi;
  if(wi>=0){const end=words[wi].w.end;wordEls[wi].classList.add('on');
   const li=words[wi].li;if(li!==curL){if(curL>=0)lineEls[curL].classList.remove('cur');curL=li;lineEls[li].classList.add('cur');
    const r=lineEls[li].getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-170)lineEls[li].scrollIntoView({block:'center',behavior:'smooth'})}}}
 $('#fill').style.width=(100*t/(au.duration||1))+'%';$('#time').textContent=fmt(t)+' / '+fmt(au.duration);
 if(!au.paused)requestAnimationFrame(tick)}
au.onplay=()=>{$('#play').textContent='Pause';requestAnimationFrame(tick)};au.onpause=()=>{$('#play').textContent='Play';tick()};au.onseeked=tick;
$('#play').onclick=()=>au.paused?au.play():au.pause();
$('#back').onclick=()=>{au.currentTime=Math.max(0,au.currentTime-5)};
const go=li=>{li=Math.max(0,Math.min(L.lines.length-1,li));const s=lstart(li);if(s!=null){au.currentTime=s;if(loopL>=0)setLoop(li)}};
$('#prev').onclick=()=>go((curL<0?0:curL)-(au.currentTime-(lstart(curL)||0)>1.5?0:1));
$('#next').onclick=()=>go(curL+1);
function setLoop(li){if(loopL>=0)lineEls[loopL].classList.remove('loop');loopL=li;if(li>=0)lineEls[li].classList.add('loop');$('#loop').classList.toggle('on',li>=0)}
$('#loop').onclick=()=>setLoop(loopL>=0?-1:Math.max(curL,0));
$('#rate').onchange=e=>{au.playbackRate=+e.target.value;au.preservesPitch=true};
$('#tl').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();au.currentTime=(e.clientX-r.left)/r.width*(au.duration||0)};
document.querySelectorAll('.w').forEach((el,i)=>el.onclick=e=>{e.stopPropagation();
 if(editing){if(sel!=null)wordEls[sel].classList.remove('sel');sel=i;el.classList.add('sel');return}
 const s=words[i].w[K];if(s!=null){au.currentTime=s;if(au.paused)au.play()}});
lineEls.forEach((el,li)=>el.onclick=()=>{const s=lstart(li);if(s!=null){au.currentTime=s;if(au.paused)au.play()}});
$('#editbtn').onclick=()=>{editing=!editing;document.body.classList.toggle('editing',editing);$('#editbtn').classList.toggle('on',editing);
 if(!editing&&sel!=null){wordEls[sel].classList.remove('sel');sel=null}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;
 if(e.code==='Space'){e.preventDefault();au.paused?au.play():au.pause()}
 else if(editing&&sel!=null&&(e.key==='t'||e.key==='T')){const w=words[sel].w,t=+au.currentTime.toFixed(2);w.start=t;
  if(sel>0&&words[sel-1].w.end!=null&&words[sel-1].w.end>t)words[sel-1].w.end=t;
  wordEls[sel].classList.remove('sel');if(sel<words.length-1){sel++;wordEls[sel].classList.add('sel')}ticks()}});
$('#dl').onclick=()=>{L.lines.forEach(ln=>{const ws=ln.words.filter(w=>w.start!=null);ln.start=ws.length?ws[0].start:null});
 const b=new Blob([JSON.stringify(L,null,1)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download=(L.title||'lesson').replace(/[^\w]+/g,'_')+'.timings.json';a.click()};
</script></body></html>
